services:
  - type: web
    name: retailrec-india
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/prepare_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "false"
